<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XOMCLOUD - Your SoundCloud Experience, Elevated</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="XOMCLOUD - Connect your SoundCloud account to manage liked tracks, create playlists, and discover new music."
    />
    <meta name="theme-color" content="#ff6b35" />
    <link
      rel="icon"
      type="image/png"
      href="assets/img/xomcloud-icon-transparent.png"
    />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://api.soundcloud.com" />
    <link rel="preconnect" href="https://secure.soundcloud.com" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XOMCLOUD" />
    <meta
      property="og:description"
      content="Your SoundCloud experience, elevated."
    />
    <meta property="og:image" content="assets/img/xomcloud-banner-transparent.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Decided before first paint, so the intro's sky is the first thing drawn
         rather than a blank page: signed-out visitors to the home page, with
         motion allowed. The app reads data-intro to know whether to play it. -->
    <script>
      (function () {
        try {
          var path = location.pathname;
          if (
            (path === '/' || path === '/home') &&
            !localStorage.getItem('sc_access_token') &&
            !matchMedia('(prefers-reduced-motion: reduce)').matches
          ) {
            document.documentElement.setAttribute('data-intro', 'play');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      .xc-boot {
        display: none;
      }
      html[data-intro='play'] {
        overflow: hidden;
      }
      /* The intro's opening frame, until the intro mounts over it; then the intro fades straight
         onto the page. Keep it identical to $sky in _atmosphere.scss. */
      html[data-intro='play']:not(:has(app-intro)) .xc-boot {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 10002;
        background: linear-gradient(180deg, #07080d 0%, #0d0f18 60%, #12131c 100%);
      }
    </style>
  </head>
  <body>
    <div class="xc-boot" aria-hidden="true"></div>
    <app-root></app-root>
  </body>
</html>
