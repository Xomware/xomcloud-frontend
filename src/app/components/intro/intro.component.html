<section class="intro" aria-label="Xomcloud intro" [class.leaving]="leaving()">
  <div class="stage" aria-hidden="true">
    <canvas #sky class="sky"></canvas>
    <canvas #gear class="sky"></canvas>
    <canvas #card class="card"></canvas>
  </div>

  <div class="mark">
    <img #logo src="assets/img/xomcloud-banner-transparent.png" alt="Xomcloud" width="1050" height="600" />
    <p #tagline>Your SoundCloud experience, elevated.</p>
  </div>

  <div class="vignette" aria-hidden="true"></div>
  <div #grain class="grain" aria-hidden="true"></div>

  <button type="button" class="skip" aria-label="Skip intro" (click)="skip()">Skip</button>
</section>
