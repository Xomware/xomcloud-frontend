name: Deploy Xomcloud Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@v1
    with:
      app: xomcloud
      node-version: '18'
      install-command: npm install
      ssm: |
        API_ID=/xomcloud/api/API_ID
      build-command: |
        f=src/environments/environment.ts
        sed -i "s|soundcloudClientId: '---'|soundcloudClientId: '$SOUNDCLOUD_CLIENT_ID'|" $f
        sed -i "s|apiAuthToken: '---'|apiAuthToken: '$API_AUTH_TOKEN'|" $f
        sed -i "s|apiId: '---'|apiId: '$API_ID'|" $f
        sed -i "s|production: false|production: true|" $f
        sed -i "s|baseCallbackUrl: 'http://localhost:4200'|baseCallbackUrl: 'https://xomcloud.xomware.com'|" $f
        if grep -nE "(soundcloudClientId|apiAuthToken|apiId): *'(---)?'" $f; then
          echo "::error::environment.ts still has placeholder credentials"
          exit 1
        fi
        npm run build -- --configuration production
      dist-dir: dist/xomcloud
      bucket: xomcloud.xomware.com
      domain: xomcloud.xomware.com
